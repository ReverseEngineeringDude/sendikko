version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sendikko-postgres
    restart: always
    environment:
      POSTGRES_USER: sendikko
      POSTGRES_PASSWORD: sendikkosecret
      POSTGRES_DB: sendikkodb
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sendikko -d sendikkodb']
      interval: 5s
      timeout: 5s
      retries: 5

  # Optional local Telegram Bot API server for bypassing 20MB / 50MB file limits
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    container_name: sendikko-telegram-bot-api
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      TELEGRAM_STAT: 1
    volumes:
      - telegram_data:/var/lib/telegram-bot-api
    ports:
      - '8081:8081'

volumes:
  pgdata:
  telegram_data:
