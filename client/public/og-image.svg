<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Subtle Glows -->
    <radialGradient id="glow1" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0" />
    </radialGradient>

    <!-- Card Background -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="630" fill="url(#bg)" />
  <circle cx="240" cy="200" r="380" fill="url(#glow1)" />
  <circle cx="960" cy="420" r="450" fill="url(#glow2)" />

  <!-- Grid overlay pattern -->
  <g stroke="#334155" stroke-opacity="0.15" stroke-width="1">
    <line x1="0" y1="90" x2="1200" y2="90" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="270" x2="1200" y2="270" />
    <line x1="0" y1="360" x2="1200" y2="360" />
    <line x1="0" y1="450" x2="1200" y2="450" />
    <line x1="0" y1="540" x2="1200" y2="540" />

    <line x1="150" y1="0" x2="150" y2="630" />
    <line x1="300" y1="0" x2="300" y2="630" />
    <line x1="450" y1="0" x2="450" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="750" y1="0" x2="750" y2="630" />
    <line x1="900" y1="0" x2="900" y2="630" />
    <line x1="1050" y1="0" x2="1050" y2="630" />
  </g>

  <!-- Outer Card Frame -->
  <rect x="60" y="50" width="1080" height="530" rx="28" fill="none" stroke="#475569" stroke-opacity="0.3" stroke-width="2" />

  <!-- Logo and App Name -->
  <g transform="translate(110, 105)">
    <!-- App Icon Box -->
    <rect width="84" height="84" rx="24" fill="url(#primary)" />
    <!-- Arrow & Node Upload Motif -->
    <path d="M26 40 L42 22 L58 40 M42 22 L42 62" stroke="#ffffff" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="42" cy="62" r="4" fill="#ffffff" />

    <!-- Brand Text -->
    <text x="110" y="56" font-family="system-ui, -apple-system, 'Inter', 'Segoe UI', sans-serif" font-size="52" font-weight="900" fill="#ffffff" letter-spacing="-1.5">
      Sendikko
    </text>

    <!-- Tag Badge -->
    <rect x="360" y="24" width="230" height="36" rx="18" fill="#6366f1" fill-opacity="0.15" stroke="#6366f1" stroke-opacity="0.4" stroke-width="1.5" />
    <text x="375" y="48" font-family="system-ui, -apple-system, 'Inter', sans-serif" font-size="14" font-weight="700" fill="#a5b4fc" letter-spacing="1">
      ZERO-KNOWLEDGE
    </text>
  </g>

  <!-- Main Headline -->
  <text x="110" y="270" font-family="system-ui, -apple-system, 'Inter', 'Segoe UI', sans-serif" font-size="50" font-weight="800" fill="#f8fafc" letter-spacing="-1">
    Free, Unlimited, Private
  </text>
  <text x="110" y="335" font-family="system-ui, -apple-system, 'Inter', 'Segoe UI', sans-serif" font-size="50" font-weight="800" fill="url(#primary)" letter-spacing="-1">
    &amp; Secure File Sharing.
  </text>

  <!-- Subheadline -->
  <text x="110" y="395" font-family="system-ui, -apple-system, 'Inter', sans-serif" font-size="22" font-weight="400" fill="#94a3b8" letter-spacing="-0.2">
    Client-side AES-256-GCM encryption with fast parallel streaming &amp; zero logs.
  </text>
  <text x="110" y="428" font-family="system-ui, -apple-system, 'Inter', sans-serif" font-size="22" font-weight="400" fill="#64748b" letter-spacing="-0.2">
    Send any file size to anyone — no registration required to download.
  </text>

  <!-- Bottom Badges / Feature Pills -->
  <g transform="translate(110, 480)">
    <!-- Pill 1: Free & Unlimited -->
    <rect x="0" y="0" width="210" height="48" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <circle cx="24" cy="24" r="6" fill="#10b981" />
    <text x="42" y="30" font-family="system-ui, -apple-system, 'Inter', sans-serif" font-size="16" font-weight="600" fill="#e2e8f0">
      Free &amp; Unlimited
    </text>

    <!-- Pill 2: AES-256-GCM -->
    <rect x="230" y="0" width="220" height="48" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <circle cx="254" cy="24" r="6" fill="#6366f1" />
    <text x="272" y="30" font-family="system-ui, -apple-system, 'Inter', sans-serif" font-size="16" font-weight="600" fill="#e2e8f0">
      AES-256-GCM Vault
    </text>

    <!-- Pill 3: No Account Needed -->
    <rect x="470" y="0" width="230" height="48" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <circle cx="494" cy="24" r="6" fill="#a855f7" />
    <text x="512" y="30" font-family="system-ui, -apple-system, 'Inter', sans-serif" font-size="16" font-weight="600" fill="#e2e8f0">
      No Account Needed
    </text>

    <!-- Pill 4: Self-Destruct Links -->
    <rect x="720" y="0" width="240" height="48" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <circle cx="744" cy="24" r="6" fill="#ec4899" />
    <text x="762" y="30" font-family="system-ui, -apple-system, 'Inter', sans-serif" font-size="16" font-weight="600" fill="#e2e8f0">
      Self-Destruct Links
    </text>
  </g>
</svg>
